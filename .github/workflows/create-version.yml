name: Create Version

on:
  workflow_dispatch:
    inputs:
      versionIncrementType:
        description: 'Version Increment Type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - manual
      manualVersionNumber:
        description: 'Manually Enter Version Number (Requires manual Version Increment Type)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create_version:
    uses: levieggert/shared-workflows/.github/workflows/spm-create-version.yml@main
    with:
      version-increment-type: ${{ inputs.versionIncrementType }}
      manual-version-number: ${{ inputs.manualVersionNumber }}
    secrets:
      create_pr_token: ${{ secrets.CREATE_PULL_REQUEST_TOKEN }}